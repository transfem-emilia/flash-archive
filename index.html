<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Emilia's Flash Archive" />
    <meta property="og:description" content="Play Flash Games" />
    <meta property="og:url" content="https://flash.greatonthelakes.com/" />
    <meta property="og:image" content="https://flash.greatonthelakes.com/images/WavingGirlTransCanadaFlag.png" />
    <meta property="og:type" content="website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emilia's Flash Game Archive</title>
    <link rel="shortcut icon" type="image/x-icon" href="./images/Waving Girl Trans Canada Flag.ico">
    <link rel="stylesheet" href="./css/styles.css">
    <!-- Include Ruffle JS -->
    <script src="/ruffle/ruffle.js"></script>
    <script src="https://kit.fontawesome.com/39ffdb166a.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="bchec.js"></script>
    <script>
      fetch("https://www.greatonthelakes.com/nav.html") 
        .then(response => response.text())
        .then(html => {
          document.getElementById("navbar").innerHTML = html;
        })
        .catch(error => {
          console.error("Error loading navbar:", error);
        });
    </script>
    <script>
    fetch("https://flash.greatonthelakes.com/footer.html") 
      .then(response => response.text())
      .then(html => {
        document.getElementById("footer").innerHTML = html;
      })
      .catch(error => {
        console.error("Error loading footer:", error);
      });
    </script>
    <script src="service-worker.js"></script>
    <script src="backend.js"></script>
</head>
<div id="navbar"></div>
<body>
  <h3 style="text-align: center; font-size: 50pt; font-family: 'Mea Culpa';"><a href="https://www.greatonthelakes.com/" class="no-underline">Emilia Selene</a></h3>
  <h2>Notice: Due to the Cloudflare outage that has happened recently, parts of the website may not load or work as expected. There’s no need to contact me.</h2>
  <h1 class="spacer">spacer</h1>
  <h3 style="text-align: center; font-size: 22pt; padding-bottom: 25px">Welcome To Emilia's Flash Game Archive</h3>
  <div class="buttons"></div>
  <div id="swf-container"></div>
  <div style="text-align: center;">
    <button id="fs-btn" style="text-align: center">Enter Fullscreen</button>
  </div>
  <div id="footer"></div>
</body>
</html>
