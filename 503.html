    <script>
        // Function to check if the device is mobile
        function isMobile() {
          return /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/.test(navigator.userAgent);
        }
    // Redirect or style links based on device type
        if (isMobile()) {
          document.addEventListener('DOMContentLoaded', function() {
            var links = document.querySelectorAll('a');
            links.forEach(function(link) {
              link.style.textDecoration = 'underline';
            });
          });
        }
      </script>
      <script>
      fetch("https://www.greatonthelakes.com/nav.html") 
        .then(response => response.text())
        .then(html => {
          document.getElementById("navbar").innerHTML = html;
        })
        .catch(error => {
          console.error("Error loading navbar:", error);
        });
    </script>
    <script>
    fetch("https://flash.greatonthelakes.com/footer.html") 
      .then(response => response.text())
      .then(html => {
        document.getElementById("footer").innerHTML = html;
      })
      .catch(error => {
        console.error("Error loading footer:", error);
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
